[hooks]
change_tracker = true
failure_loop = true
context_snapshot = true
context_restore = true
session_summary = true
agent_handoff = true
test_failure = true
context_checkpoint = true
environment_detection = true
uv_rewrite = true

[failure_loop]
threshold = 2

[agent_handoff]
strict = false

[python]
uv_only = true


[git.commit_msg]
require_ticket = false

[git.pre_commit]
format = true
tests = true

[git.post_checkout]
uv_sync = true

# Optional test runner override, as an argv array, not a shell string.
# [git.tests]
# command = ["uv", "run", "--group", "dev", "pytest", "-q"]
