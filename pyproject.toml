[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-hooks"
version = "0.1.0"
description = "Deterministic lifecycle hooks for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
codex-hooks = "codex_hooks.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_hooks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
